<!doctype html><html lang="en"><meta charset="utf-8"><title>Linkcard worker</title><script>
'use strict';
const channel='linkcard-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const helperBase='http://127.0.0.1:43187';
const cache=new Map(), pending=new Map(), seen=new Set(), queue=[];
let active=0, connected=false, connectTimer, helperProbe=null, helperChecked=0;
function post(message){parent.postMessage({pluginMessage:{...message,channel}},'*');}
function publicUrl(raw){
  const input=String(raw||'').trim();
  if(input.length>4096 || /[\s\\]/.test(input))throw Error('Invalid URL.');
  const u=new URL(/^www\./i.test(input)?'https://'+input:input), h=u.hostname.toLowerCase().replace(/\.$/,'');
  if(!['http:','https:'].includes(u.protocol)||u.username||u.password||!h.includes('.')||h.includes(':')||/^\d+(\.\d+){3}$/.test(h)||h==='localhost'||/\.(local|internal|localhost)$/.test(h)||u.port&&!['80','443'].includes(u.port))throw Error('Only public webpage URLs are supported.');
  return u.href;
}
function fallbackTitle(url){
  const u=new URL(url), tail=u.pathname.split('/').filter(Boolean).pop()||'';
  try{return decodeURIComponent(tail).replace(/[-_]+/g,' ').replace(/\.[a-z0-9]{2,5}$/i,'').slice(0,240)||u.hostname.replace(/^www\./,'');}catch(_){return u.hostname;}
}
async function request(url,kind='json',ms=6000){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),ms);
  try{
    const r=await fetch(url,{signal:controller.signal,credentials:'omit',referrerPolicy:'no-referrer'});
    if(!r.ok)throw Error('Preview request failed.');
    if(kind==='blob'){
      const length=Number(r.headers.get('content-length')||0);if(length>6*1024*1024)throw Error('Cover is too large.');
      const b=await r.blob();if(b.size>6*1024*1024)throw Error('Cover is too large.');return b;
    }
    return await r.json();
  }finally{clearTimeout(timer);}
}
function helper(){
  if(!helperProbe || Date.now()-helperChecked>30000){
    helperChecked=Date.now();
    helperProbe=request(helperBase+'/health','json',700).then(d=>d.service==='linkmark').catch(()=>false);
  }
  return helperProbe;
}
function validate(data){
  if(!data || !data.title)throw Error('No page title.');
  if(/^(access denied|forbidden|just a moment|attention required)/i.test(data.title)||/don.t have authori[sz]ation|access denied|verify you are human/i.test(data.description||''))throw Error('Website blocked preview access.');
  return data;
}
async function metadata(url){
  const u=new URL(url);
  if(/\.(png|jpe?g|webp)$/i.test(u.pathname))return {title:fallbackTitle(url),image:{url}};
  if(await helper()){
    try{return validate((await request(helperBase+'/metadata?url='+encodeURIComponent(url),'json',6500)).data);}catch(_){}
  }
  let endpoint='';
  if(/(^|\.)youtube\.com$/.test(u.hostname)||u.hostname==='youtu.be')endpoint='https://www.youtube.com/oembed?format=json&url='+encodeURIComponent(url);
  if(/(^|\.)vimeo\.com$/.test(u.hostname))endpoint='https://vimeo.com/api/oembed.json?url='+encodeURIComponent(url);
  if(endpoint){try{const d=await request(endpoint,'json',4000);return validate({title:d.title,description:d.author_name||'',image:{url:d.thumbnail_url||''}});}catch(_){}}
  return validate((await request('https://api.microlink.io/?url='+encodeURIComponent(url),'json',5000)).data);
}
async function decode(blob){
  const src=URL.createObjectURL(blob);
  try{return await new Promise((resolve,reject)=>{const img=new Image();const timer=setTimeout(()=>reject(Error('Image decode timed out.')),3000);img.onload=()=>{clearTimeout(timer);resolve(img);};img.onerror=()=>{clearTimeout(timer);reject(Error('Invalid cover.'));};img.src=src;});}
  finally{URL.revokeObjectURL(src);}
}
async function cover(raw){
  if(!raw)return null;
  const url=publicUrl(raw);
  if(await helper()){
    try{return await decode(await request(helperBase+'/image?url='+encodeURIComponent(url),'blob',6000));}catch(_){}
  }
  // CORS-readable covers can still work without the optional helper.
  return await decode(await request(url,'blob',4000));
}
function lines(ctx,value,x,y,width,lineHeight,maxLines){
  const chars=Array.from(String(value||'').replace(/\s+/g,' ').trim());
  let line='',row=0;
  for(let i=0;i<chars.length;i++){
    const next=line+chars[i];
    if(ctx.measureText(next).width>width && line){
      if(row===maxLines-1){while(line && ctx.measureText(line+'…').width>width)line=line.slice(0,-1);ctx.fillText(line+'…',x,y+row*lineHeight);return;}
      ctx.fillText(line.trim(),x,y+row*lineHeight);row++;line=chars[i].trimStart();
    }else line=next;
  }
  if(line)ctx.fillText(line,x,y+row*lineHeight);
}
function raster(url,data,image){
  const canvas=document.createElement('canvas');canvas.width=720;canvas.height=640;
  const ctx=canvas.getContext('2d');ctx.scale(2,2);ctx.textBaseline='top';
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,360,320);
  if(image){
    const w=image.naturalWidth||image.width,h=image.naturalHeight||image.height,ratio=Math.max(360/w,176/h);
    ctx.save();ctx.beginPath();ctx.rect(0,0,360,176);ctx.clip();ctx.drawImage(image,(360-w*ratio)/2,(176-h*ratio)/2,w*ratio,h*ratio);ctx.restore();
  }else{
    ctx.fillStyle='#f1f1ef';ctx.fillRect(0,0,360,176);ctx.fillStyle='#777773';ctx.font='16px "Segoe UI", Arial, sans-serif';
    lines(ctx,new URL(url).hostname.replace(/^www\./,''),24,78,312,22,1);
  }
  ctx.fillStyle='#292929';ctx.font='16px "Segoe UI", Arial, sans-serif';lines(ctx,data.title||fallbackTitle(url),18,193,324,22,2);
  ctx.fillStyle='#858585';ctx.font='12px "Segoe UI", Arial, sans-serif';lines(ctx,data.description||'',18,243,324,17,2);
  ctx.fillStyle='#777777';ctx.font='12px "Segoe UI", Arial, sans-serif';lines(ctx,new URL(url).hostname.replace(/^www\./,''),18,292,324,17,1);
  const binary=atob(canvas.toDataURL('image/jpeg',0.92).split(',')[1]);
  return Uint8Array.from(binary,c=>c.charCodeAt(0));
}
async function build(url){
  if(cache.has(url))return cache.get(url);
  if(pending.has(url))return pending.get(url);
  const promise=(async()=>{
    let data={title:fallbackTitle(url)},image=null,incomplete=false;
    try{data=await metadata(url);}catch(_){incomplete=true;}
    if(data.image&&data.image.url){try{image=await cover(data.image.url);}catch(_){incomplete=true;}}
    const result={title:String(data.title||fallbackTitle(url)),bytes:raster(url,data,image),incomplete};
    // Failed previews are retryable; only complete results are cached.
    if(!incomplete){if(cache.size>=20)cache.delete(cache.keys().next().value);cache.set(url,result);}
    return result;
  })();
  pending.set(url,promise);
  try{return await promise;}finally{pending.delete(url);}
}
function drain(){
  while(active<3 && queue.length){
    const task=queue.shift();active++;
    build(task.url).then(result=>{
      post({type:'card',sourceId:task.sourceId,...result,final:true});
      if(result.incomplete)post({type:'notice',text:'Some preview content was unavailable. Your card is still ready to move.'});
    }).catch(()=>post({type:'notice',text:'Preview could not be completed. The initial card is kept.',error:true})).finally(()=>{active--;drain();});
  }
}
function handleTask(message){
  if(seen.has(message.sourceId))return;
  let url;
  try{url=publicUrl(message.url);}catch(error){post({type:'notice',text:error.message,error:true});return;}
  if(queue.length+active>=20){post({type:'notice',text:'Please paste up to 20 links at a time.',error:true});return;}
  seen.add(message.sourceId);if(seen.size>200)seen.delete(seen.values().next().value);
  if(cache.has(url)){post({type:'card',sourceId:message.sourceId,...cache.get(url),final:true});return;}
  try{
    // First card needs no network, downloaded fonts, favicon or editable layers.
    post({type:'card',sourceId:message.sourceId,title:fallbackTitle(url),bytes:raster(url,{title:fallbackTitle(url)},null),final:false});
    queue.push({url,sourceId:message.sourceId});drain();
  }catch(_){post({type:'notice',text:'Could not draw the card. The original URL is preserved.',error:true});}
}
window.addEventListener('message',event=>{
  const m=event.data&&event.data.pluginMessage;if(!m||m.channel!==channel)return;
  if(m.type==='init'){connected=true;clearTimeout(connectTimer);helper();}
  if(m.type==='render')handleTask(m);
});
function connect(){if(connected)return;post({type:'ready'});connectTimer=setTimeout(connect,1500);}
connect();
</script></html>
